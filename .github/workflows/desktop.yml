name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @agentbridge/web typecheck
      - run: pnpm --filter @agentbridge/web lint
      - run: pnpm test
      - run: pnpm desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Allow the Electron test to create its sandbox
        if: runner.os == 'Linux'
        run: |
          sudo tee /etc/apparmor.d/agentbridge-ci > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile agentbridge-ci "/tmp/AgentBridge desktop smoke */application/agentbridge" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/agentbridge-ci
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop
        env:
          AGENT_DESKTOP_EXECUTABLE: ${{ github.workspace }}/code/desktop-release/linux-unpacked/agentbridge
          DEBUG: pw:browser
      - name: Bundle, install and initialize the final Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop-release -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          $bundle = Join-Path $env:RUNNER_TEMP 'AgentBridge deployment'
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item $installers[0].FullName, tools/Initialize-AgentBridge.ps1, tools/initialize.mjs, tools/initialize.example.json, ../INSTRUCTION.md -Destination $bundle
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path "$bundle/*" -DestinationPath "desktop-release/AgentBridge-$version-windows-x64-deploy.zip"
          # Test adjacent JSON/Skill discovery without publishing fixture data or credentials.
          $skill = Join-Path $bundle 'skills/office'
          New-Item -ItemType Directory -Path $skill -Force | Out-Null
          Set-Content -Path "$skill/SKILL.md" -Value "---`nname: office`ndescription: Deployment smoke fixture`n---`nFixture instructions."
          @{ schemaVersion = 1; skills = @(@{ id = 'office'; path = 'skills/office' }) } | ConvertTo-Json -Depth 10 | Set-Content "$bundle/settings.json"
          @{ schemaVersion = 1; applying = $false; gateway = @{ host = '127.0.0.1'; port = 0 }; network = @{ mode = 'direct' } } | ConvertTo-Json -Depth 10 | Set-Content "$bundle/system.json"
          $installDirectory = Join-Path $env:RUNNER_TEMP 'AgentBridge installed smoke'
          $profile = Join-Path $env:RUNNER_TEMP 'AgentBridge initialized smoke'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$bundle/Initialize-AgentBridge.ps1" -InstallDirectory $installDirectory -DataDirectory $profile
          if ($LASTEXITCODE -ne 0) { throw "Deployment initialization failed: $LASTEXITCODE" }
          $settings = Get-Content "$profile/data/settings.json" -Raw | ConvertFrom-Json
          if ($settings.skills[0].path -ne (Join-Path $profile 'data/skills/office')) { throw 'Skill path was not rewritten' }
          if (!(Test-Path "$profile/data/skills/office/SKILL.md")) { throw 'Skill was not installed' }
          $system = Get-Content "$profile/data/system.json" -Raw | ConvertFrom-Json
          if ($system.gateway.port -ne 0) { throw 'System configuration was not imported' }
          $env:AGENT_DESKTOP_EXECUTABLE = Join-Path $installDirectory 'agentbridge.exe'
          if (!(Test-Path $env:AGENT_DESKTOP_EXECUTABLE)) { throw "Installed executable is missing" }
          pnpm test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBridge-${{ matrix.os }}
          path: |
            code/desktop-release/*.exe
            code/desktop-release/*.AppImage
            code/desktop-release/*.dmg
            code/desktop-release/*.zip
            code/desktop-release/*.blockmap
            code/desktop-release/latest*.yml
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: AgentBridge-*
          merge-multiple: true
          path: release-assets
      - name: Publish installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./code/desktop/package.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag must match desktop/package.json version: $tag" >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$tag" > /dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          # Match electron-builder's GitHub-safe names in latest*.yml.
          for asset in release-assets/*; do
            if [[ "$asset" == *" "* ]]; then mv -- "$asset" "${asset// /-}"; fi
          done
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" --title "AgentBridge $version" \
            --generate-notes \
            --notes "Desktop installers for Windows x64, Linux x64 and macOS arm64. Agent CLIs install on demand from the management page. These builds are not signed or notarized."
